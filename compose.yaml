services:
  mysql:
    image: mysql:8.4
    ports:
      - '127.0.0.1:3307:3306'
    environment:
      MYSQL_DATABASE: membrane_store
      MYSQL_USER: membrane
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - membrane_mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u membrane membrane_store -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  membrane_mysql:
